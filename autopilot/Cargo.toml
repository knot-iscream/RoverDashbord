[package]
name = "rover-autopilot"
version = "0.1.0"
edition = "2021"
description = "Pi-side autonomy loop for the firefighter survey rover"

[lib]
name = "autopilot"
path = "src/lib.rs"

[[bin]]
name = "rover-autopilot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
