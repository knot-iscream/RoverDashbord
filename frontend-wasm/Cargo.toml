[package]
name = "frontend-wasm"
version = "2.0.2"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "Node", "NodeList", "HtmlElement",
  "HtmlInputElement", "HtmlSpanElement", "HtmlCanvasElement", "DomTokenList",
  "CanvasRenderingContext2d", "WebSocket", "MessageEvent", "CloseEvent",
  "Event", "InputEvent", "MouseEvent", "KeyboardEvent", "Performance",
  "Storage", "DomRect", "console", "UrlSearchParams",
  "Location", "History",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
