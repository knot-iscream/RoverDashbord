[package]
name = "frontend-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["console", "Window", "Location"] }
