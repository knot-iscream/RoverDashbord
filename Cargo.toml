[workspace]
members = [".", "desktop", "frontend-wasm"]
# Backend stays the default so `cargo run` / `cargo test` keep working unchanged.
# frontend-wasm builds only via trunk (wasm target), never in the default set.
default-members = ["."]

[package]
name = "digital-twin-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
futures-util = { version = "0.3", features = ["sink"] }
chrono = { version = "0.4", features = ["serde"] }
rust_xlsxwriter = "0.64"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.26"
criterion = "0.5"

[[bench]]
name = "telemetry"
harness = false

[profile.dev]
# Iteration profile: fastest links for the `cargo run -p roverdash` debug
# loop (line tables only). Release stays LTO below; never iterate on it.
debug = 1

# The WASM bundle must NOT carry debug info: rustc emits a 60MB+ `name`
# section into wasm for debuginfo>0 and trunk's wasm-opt keeps it. The
# backend keeps line tables; the dashboard keeps none (browser traces stay
# numeric, panic messages intact). Without this the bundle is ~64MB.
[profile.dev.package.frontend-wasm]
debug = false

[profile.release]
# Real-app profile: slowest build, smallest + fastest binary.
lto = true
codegen-units = 1
strip = true
