[package]
name = "roverdash"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
digital-twin-dashboard = { path = ".." }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
