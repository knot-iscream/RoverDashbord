# WASM-only rustflags: strip symbols so rustc never emits the 60MB+ `name`
# section (Leptos/tachys monomorphized symbol names run to kilobytes each,
# and trunk's wasm-opt keeps them). MSVC backend builds are untouched.
# Panic messages still work; browser stack traces stay numeric.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "strip=symbols"]

# Repo task aliases (see xtask/): `cargo launch | dev | doctor | package`.
[alias]
xtask = "run -p xtask --"
launch = "run -p xtask -- launch"
dev = "run -p roverdash"
doctor = "run -p xtask -- doctor"
pack = "run -p xtask -- package"
